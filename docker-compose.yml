services:

  api:
    build: .
    container_name: apiratelimiter-api

    ports:
      - "8080:8080"

    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/apiratelimiter
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD}

      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379

      APP_BASE_URL: http://localhost:8080

    depends_on:
      - mysql
      - redis


  mysql:
    image: mysql:8.0
    container_name: apiratelimiter-mysql

    environment:
      MYSQL_DATABASE: apiratelimiter
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD}

    ports:
      - "3307:3306"

    volumes:
      - mysql_data:/var/lib/mysql


  redis:
    image: redis:7
    container_name: apiratelimiter-redis

    ports:
      - "6380:6379"


volumes:
  mysql_data: